# ---------------------------------------------------------------------------
# codriver settings.
#
# You do not need to edit this file. The Config tab in the browser UI shows
# every value below with its explanation, and saves your changes to
# config/local.yaml. Changes apply within half a second, even while driving.
#
# Values under "stage" only take effect when you build or learn a stage.
# Values under "runtime" and "audio" take effect live.
# ---------------------------------------------------------------------------

telemetry:
  # Which game the telemetry comes from. Only "fh6" exists today.
  adapter: fh6
  # Which network address to listen on. "0.0.0.0" means: anything that reaches
  # this PC. Leave it unless you know why you would change it.
  bind_host: "0.0.0.0"
  # The UDP port the game sends telemetry to. Must match the in-game setting
  # (Settings, HUD and Gameplay, Data Out IP Port). Avoid 5200-5300, the game
  # uses that range itself, even though many online guides say 5300.
  port: 5400
  # Network buffer size in bytes. Bigger means fewer lost packets if the PC is
  # briefly busy. No need to touch this.
  socket_rcvbuf_bytes: 1048576
  # How long to wait for a packet before checking whether the stream stopped,
  # in seconds.
  socket_timeout_s: 0.5
  # Size of one telemetry packet in bytes. Forza Horizon 6 sends 324.
  expected_packet_size: 324

capture:
  # Folder where recon recordings are saved.
  dir: "recordings"
  # How often a recording is written to disk, in seconds. Lower means less
  # data lost if the PC crashes mid-drive.
  flush_interval_s: 2.0
  # Also record packets from menus and pauses. Keeps everything; filtering
  # happens later.
  include_race_off: true
  # Auto-record ("Auto-record every race" on the Setup tab, or capture --auto):
  # one listener for the whole evening, a new recording per race. A race is
  # recognised by the game's own race position, which is 1 and up only inside
  # events; free roam and menus report 0.
  auto:
    # This many racing packets in a row before a race counts, about half a
    # second. Keeps a single stray packet from opening a file.
    start_frames: 15
    # This long without racing packets ends the race (finish, quit, menu).
    end_s: 3.0
    # No packets at all for this long ends it too (loading screens).
    gap_s: 5.0
    # Seconds before the race start to keep, so the recording has the
    # countdown and the first metre.
    preroll_s: 2.0
    # Recordings shorter than this are restarts and blips, not races; dropped.
    min_seconds: 20

replay:
  # Where a replay sends the packets. Usually this PC.
  host: "127.0.0.1"
  # Port a replay sends to. Same as telemetry.port so the co-driver hears it.
  port: 5400
  # Playback speed. 1.0 is real time, 2.0 is twice as fast.
  speed: 1.0
  # Start over when the recording ends.
  loop: false
  # Shorten long silences (menus, pauses) to this many seconds. Empty keeps
  # them exactly as recorded.
  max_gap_s: null
  # Timing precision of the replay. Leave it.
  spin_margin_s: 0.0015

# ---------------------------------------------------------------------------
# Stage building: how a recording becomes pace notes. Rebuild after changes.
# ---------------------------------------------------------------------------
stage:
  line:
    # A stretch of driving shorter than this many frames is ignored when
    # picking the recon lap out of a recording.
    min_segment_frames: 60
    # Points closer together than this (metres) are merged. Removes the pile
    # of identical points from standing still.
    min_step_m: 0.25
    # Driving slower than this (km/h) at the start and end of the recording is
    # cut off, so waiting at the line is not part of the stage.
    trim_below_kmh: 3.6
    # A recording that ends within this many metres of where it started is a
    # circuit: the co-driver keeps going round instead of falling silent at
    # the start/finish line. A recording with several laps is cut to one
    # (the first line-to-line lap) before this is checked.
    loop_close_m: 60.0
    # ...and it has to be at least this long, so a short rewind back to the
    # start is not mistaken for a circuit.
    loop_min_length_m: 300.0

  resample:
    # Gaps in the recording longer than this (metres) are filled in first.
    max_gap_before_subdivide_m: 30.0
    # Distance between points on the finished stage line, in metres. All the
    # other "points" settings count in these steps. 3 is a good value.
    spacing_m: 3.0
    # Internal step size when laying out the line. Leave it.
    walk_step_m: 0.25

  curvature:
    # How far the corner detector looks to each side, in points (11 points is
    # about 33 metres). Higher smooths out small wobbles from the recon lap
    # and gives fewer false corners. Lower catches tighter details but calls
    # more wobbles corners. Try 9 to 13.
    window_points: 11
    # Internal threshold for "this is a straight". Leave it.
    min_divisor: 1.0e-4
    # The cornering grip the severity numbers are based on, in g. With 0.3 g,
    # a corner you could take at 40 km/h is a "2". This is only a scale; the
    # numbers stay the same relative to each other if you change it.
    comfortable_lateral_g: 0.3
    # What the severity numbers 1 to 6 mean, as speeds in km/h. A corner is a
    # "1" if it can be taken up to 30 km/h, a "2" up to 40, and so on. Anything
    # faster than the last number is not called at all. Lower the last number
    # and gentle kinks stop being called.
    class_speed_bands_kmh: [30, 40, 50, 70, 90, 110]
    # Check left and right against the steering recorded on the recon lap and
    # flip them if they disagree. Leave on.
    auto_orient: true

  notes:
    # When a corner gets tighter within this many points (20 points is about
    # 60 metres), it is called once, at the start, with the tighter number.
    # Tighter corners further away get their own call.
    collapse_window_points: 20
    # Say "left tightens 3" instead of "3 left" when the corner keeps
    # tightening for at least this many points after the call (12 points is
    # about 36 metres).
    tightens_min_run_points: 12
    # Only corners this tight or tighter get the "tightens" phrasing.
    # "tightens 5" is not worth saying.
    tightens_max_severity: 3
    # Two corners closer than this (metres) are joined with "into".
    link_into_max_m: 20.0
    # Two corners closer than this (metres) are joined with "and".
    link_and_max_m: 50.0
    # Most corners that can be joined into one call. Keeps a slalom from
    # becoming one endless sentence.
    max_linked_notes: 3
    # If the next corner is at least this far away (metres), the distance is
    # said first, like "one hundred, three right".
    distance_call_min_m: 60.0
    # The distances the co-driver can say. A gap is rounded down to the
    # nearest one.
    distance_buckets_m: [30, 50, 70, 100, 150, 200, 250, 300, 400, 500]
    # A corner that goes on for at least this many metres is called "long".
    long_min_m: 120.0

  learn:
    # Learn only moves a point on the line if at least this many drives went
    # past it.
    min_samples_per_point: 2
    # How much to smooth the learned line, in points. Higher means one odd
    # moment on one drive changes less.
    smooth_points: 5
    # Drives further than this (metres) from the current line at a point are
    # ignored there. Keeps a cut across a field out of the road.
    max_shift_m: 6.0
    # A recorded drive that matched the stage for less than this share of its
    # frames is not this stage. It is skipped.
    min_tracked_fraction: 0.5

  hazards:
    # A jump is when all four wheels are fully extended. Suspension values
    # below this count as "in the air" (0 is fully extended, 1 is fully
    # compressed).
    jump_susp_max_stretch: 0.05
    # The wheels have to be in the air at least this long (seconds) to count
    # as a jump, so a bump is not a jump.
    jump_min_duration_s: 0.15
    # How steep the road has to rise before a brow to be called a crest.
    # 0.06 means 6 metres up per 100 metres.
    crest_gradient: 0.06
    # How steep the road has to fall into a hollow to be called a dip.
    dip_gradient: -0.06
    # Water: the game reports each wheel that is in water, and a stretch of
    # road where enough wheels are wet is called "water" (a ford, a stream
    # across the track). This is how many of the four wheels have to be in
    # water before it counts. 2 keeps a roadside puddle under one wheel out
    # of it.
    water_min_wheels: 2
    # The wet stretch has to be at least this long (metres) to be called, so
    # a splash is not a call. If you recorded the recon lap in heavy rain and
    # puddles get called, raise it.
    water_min_length_m: 5.0
    # Two wet stretches closer together than this (metres) are one crossing,
    # called once.
    water_merge_gap_m: 15.0

# ---------------------------------------------------------------------------
# Runtime: how the co-driver follows you and times the calls. Takes effect live.
# ---------------------------------------------------------------------------
runtime:
  locate:
    # How far behind the last known position the co-driver looks for the car,
    # in points (50 points is about 150 metres).
    search_back_points: 50
    # How far ahead it looks, in points (300 points is about 900 metres).
    # Keeping the search short is what stops it jumping to the wrong part of
    # the stage where the road crosses or doubles back on itself.
    search_forward_points: 300
    # If the car is further than this (metres) from the stage line, the
    # co-driver counts that as "off the stage".
    lost_distance_m: 25.0
    # After this many packets off the stage, the co-driver searches the whole
    # stage again to find you. Roughly 30 packets is one second.
    lost_after_packets: 30

  gaps:
    # No telemetry for this long (seconds) means the game is paused, rewinding
    # or finished. The co-driver stops talking and clears pending calls.
    suspend_after_s: 0.5
    # When telemetry returns and the car is further away than this (metres),
    # it counts as a rewind or restart and the co-driver starts fresh.
    rewind_jump_m: 50.0

  trigger:
    # How many seconds before the corner a call should be finished. The most
    # important setting. Higher means earlier calls. 1.5 to 2.0 feels right
    # for most people.
    reaction_buffer_s: 1.8
    # Speeds (km/h) at which the extra lead below applies.
    speed_curve_kmh:  [0,   60,  120, 200]
    # Extra lead at those speeds, as a factor. 1.25 means calls come 25%
    # earlier at 200 km/h. Raise these if calls feel late when going fast.
    speed_curve_mult: [1.0, 1.0, 1.1, 1.25]
    # A call never comes later than this many metres before the corner, even
    # when driving slowly.
    min_lead_m: 15.0
    # A call never comes earlier than this many metres before the corner, even
    # when driving very fast.
    max_lead_m: 400.0

  record:
    # Record every drive so that Learn can improve the stage afterwards. Costs
    # nothing. Turn off to keep drives out of the runs folder.
    enabled: true
    # Folder for recorded drives.
    dir: "recordings/runs"

  auto:
    # Evening mode (Auto on the Drive tab): how close to a stage's first
    # metres the car has to be at race start for that stage to count, in
    # metres. Stages that start at the same place are told apart later by
    # where you drive; this only picks the candidate.
    match_radius_m: 40.0
    # How far into each stage the start area reaches, in metres.
    match_head_m: 120.0
    # How long after the race start to keep looking for a matching stage,
    # in seconds, for starts that sit a little before the recorded line.
    match_window_s: 15.0

  queue:
    # Calls closer together than this (seconds) are spoken as one phrase.
    link_window_s: 1.2
    # A joined phrase longer than this (seconds) drops its less important part
    # instead. The co-driver never talks over itself.
    max_phrase_s: 3.5
    # A call that could only finish this many seconds after the corner is
    # skipped. Silence beats hearing "three right" in the middle of it.
    drop_if_later_than_s: 0.3

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------
audio:
  # Name of the voice pack to use, from the voices folder. "default" is what
  # Generate creates for English, "de" for German. Without a pack you hear
  # placeholder beeps. Read when the co-driver starts: after changing it,
  # press Stop and then Start on the Drive tab.
  voice_pack: "default"
  # Folder where voice packs live.
  voices_dir: "voices"
  # Audio sample rate. Leave at 48000.
  samplerate: 48000
  # Mono. Leave it.
  channels: 1
  # Audio buffer size. Smaller means lower delay; too small crackles.
  blocksize: 256
  # Output device name or number. Empty uses the Windows default. Useful if
  # the voice should come out of a headset instead of the speakers.
  device: null
  # How much two words overlap when spoken together, in milliseconds. Lower
  # sounds choppier, higher slurs.
  crossfade_ms: 25
  # Volume in dB. 0 is as generated, -6 is about half as loud, 6 is louder.
  gain_db: 0.0
  # Length of the placeholder beep per word, in seconds, used when no voice
  # pack is set. Keeps the timing realistic before a voice exists.
  placeholder_clip_s: 0.35

# ---------------------------------------------------------------------------
# Colours for the corner classes, one place for the map on the Stages tab and
# the overlay arrow alike. 1 is the tightest corner, 6 barely a bend. #rrggbb.
# ---------------------------------------------------------------------------
display:
  colours:
    class_1: "#ff3b30"
    class_2: "#ff7a1a"
    class_3: "#ffcc00"
    class_4: "#4cd964"
    class_5: "#2fb3ff"
    class_6: "#8e6bff"
    # Straight road on the map.
    straight: "#a0a0a8"
    # Jumps, crests, dips: the hazard colour on the map and in the overlay.
    hazard: "#ffd60a"
    # Water crossings.
    water: "#2fb3ff"

# ---------------------------------------------------------------------------
# On-screen overlay: a transparent, click-through window on top of the game
# that shows the next corner as an arrow and text. Forza must run in
# Borderless Windowed (Settings, Video, Display Mode). In exclusive Fullscreen
# the game draws over everything and the overlay cannot be seen, whatever the
# settings below say. Start it with the Overlay button on the Drive tab or
# with "codriver overlay".
# ---------------------------------------------------------------------------
overlay:
  # Key combination that switches edit mode on and off. In edit mode the
  # window can be dragged by its body and resized at the bottom-right corner;
  # outside edit mode it is click-through and the game gets every click.
  hotkey: "ctrl+shift+o"
  # Where the overlay sits and how big it is, as shares of the screen, so it
  # looks the same on any monitor: x and y are the top-left corner (0.76 is
  # 76 % in from the left, 0.14 is 14 % down from the top: top right, under
  # the game's own header), size is the height (0.26 is 26 % of the screen
  # height; text and arrow scale with it), aspect is width divided by height.
  # Dragging and resizing in edit mode saves these.
  x: 0.70
  y: 0.06
  size: 0.19
  aspect: 1.1
  # How solid the overlay is, 0.2 (faint) to 1.0 (fully opaque).
  opacity: 1.0
  # Text size and arrow size, as factors. 1.2 is a fifth larger.
  text_scale: 1.0
  arrow_scale: 1.0
  # How far the arrow bends for each corner class 1 to 6, in degrees: 170 is
  # a hairpin, 30 a kink. Colours come from display.colours below, the same
  # ones the map on the Stages tab uses.
  bend_degrees: [170, 135, 105, 80, 55, 30]
  # The distance bar under the arrow is full at this many metres and shrinks
  # to nothing at the corner.
  bar_full_m: 200
  # The look follows the game's own HUD. Font: a file name from
  # C:\Windows\Fonts (or a full path). The Horizon UI font is a custom
  # Helvetica; Arial Bold is the stand-in every Windows has. Try
  # "segoeuib.ttf" for Segoe UI Bold, "bahnschrift.ttf" for a DIN look.
  font: "arialbd.ttf"
  # Accent colour for the arrow and the distance, as #rrggbb: Horizon lime.
  accent: "#c8ff00"
  # A dark rounded tag behind the call text, like the game's button prompts.
  # Off for text straight on the game picture.
  panel: true
  # Where a stand-alone overlay ("codriver overlay") reads its notes: the
  # UI's event stream. The Overlay button on the Drive tab needs no address.
  feed_url: "ws://127.0.0.1:8777/ws"

community:
  # The public GitHub repo that holds stages shared by other players
  # (owner/name). The Stages tab lists them and can install them; Share
  # opens its upload page. Empty disables the Community section.
  repo: "W0nt3x/codriver-stages"
  # Branch of that repo to read from.
  branch: "main"
  # Web address of the community relay, the small service that turns Share
  # into one click by opening the pull request for you (the relay/ folder
  # holds it). Empty means Share writes the file, opens the upload page,
  # and you drag the file onto it yourself.
  relay_url: "https://codriver-relay.wontex81.workers.dev/"
  # Sent along with every share as a header, and the relay only accepts shares
  # that carry it. This value is public on purpose: it sits in this file in a
  # public repository so that every install can share with one click. It is
  # not a leaked secret, it is a bot filter. It keeps scanners and strangers
  # who never looked at the code off the relay; the relay itself can do
  # nothing but open pull requests on the community repository, which a human
  # merges. Must match the SHARE_SECRET set on the relay; empty sends nothing.
  relay_secret: ""

logging:
  # How much the terminal prints: DEBUG, INFO, WARNING or ERROR.
  level: INFO
  # How many telemetry lines per second the listen command prints. 0 prints
  # every packet.
  listen_print_hz: 4.0
