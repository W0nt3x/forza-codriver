[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codriver"
version = "0.2.0"
description = "Rally pace-note co-driver for Forza Horizon 6, driven by official UDP telemetry"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# TTS for `codriver voice generate --engine edge`. The offline sapi engine
# needs nothing beyond Windows.
voice = ["edge-tts>=6.1"]
# httpx is what Starlette's TestClient drives the API tests with.
dev = ["pytest>=7.4", "httpx>=0.24"]

[project.scripts]
codriver = "codriver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codriver.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
